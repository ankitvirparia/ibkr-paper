gateway:
  base_url: "https://localhost:5000/v1/api"
  verify_ssl: false   # gateway uses a local self-signed cert
  timeout: 15

allocation:
  equity_sleeve_pct: 50
  options_sleeve_pct: 50

risk:
  max_position_pct: 10
  max_total_positions: 12
  max_daily_loss_pct: 2

universe:
  equity: [AAPL, MSFT, NVDA, AMZN, META, GOOGL, AVGO, JPM, XOM, UNH]
  # Liquid names for the intraday opening-range-breakout strategy
  intraday: [SPY, QQQ, AAPL, MSFT, NVDA, AMZN, META, TSLA]
  options_etf: [SPY, QQQ]
  # NASDAQ-100 most liquid names for put selling (tight option spreads)
  options_stocks: [AAPL, MSFT, NVDA, AMZN, META, TSLA, GOOGL, AVGO, COST, NFLX,
                   AMD, QCOM, INTU, AMGN, TXN, LIN, PEP, TMUS, CSCO, ADBE]

strategies:
  us_momentum:
    lookback: 20
    trend_ma: 50
    atr_period: 14
    risk_per_trade_pct: 1.0
  options_income:
    min_delta: 0.01
    max_delta: 0.30
    min_iv_pct: 8.0
    min_theta: 0.005
    max_candidates: 5
    otm_pct: 5.0
    min_dte: 30
    max_dte: 45
    max_sleeve_per_put_pct: 25.0
  intraday_orb:
    or_minutes: 30
    entry_start: "10:00"
    entry_end: "11:30"
    time_exit: "15:45"
    min_range_pct: 0.15
    risk_per_trade_pct: 0.5
    target_r: 2.0

paper:
  starting_cash: 100000
  db_path: "/data/paper.db"
